name: Experimental macOS compile
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run native:build
      - uses: actions/upload-artifact@v4
        with:
          name: yellow-player-experimental-macos-binary
          path: src-tauri/target/release/yellow-player
